name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate and test release source
        run: |
          python -X utf8 tools/verify_public.py --tracked
          python -X utf8 -m unittest discover -s tests
      - name: Build verified release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -X utf8 tools/build_release.py --output-dir dist --expected-tag "$RELEASE_TAG"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "academic-deai-zh $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
